# ==========================================
# JELLYFISH THEME
# True colour / 24-bit RGB
# ==========================================

# Terminal configuration
set -g default-terminal "tmux-256color"

# Enable true colour support
# GNOME Terminal and xterm-compatible terminals
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",gnome*:RGB"

# ==========================================
# JELLYFISH COLOUR PALETTE
# ==========================================

# Background:          #0F0021
# Foreground:          #EF889C
# Accent / Bold:       #3B8EEA
# Highlight text:      #F28B9E
# Highlight background:#25203D

# ==========================================
# PANE BORDERS
# ==========================================

set-window-option -g pane-border-style 
    fg="#25203D",bg="#0F0021"

set-window-option -g pane-active-border-style 
    fg="#3B8EEA",bg="#0F0021"

# ==========================================
# PANE DIMMING
# ==========================================

# Inactive panes
set-window-option -g window-style 
    fg="#EF889C",bg="#0F0021"

# Active pane
set-window-option -g window-active-style 
    fg="#F28B9E",bg="#25203D"

# ==========================================
# COMMAND / MESSAGE LINE
# ==========================================

set-window-option -g message-style 
    fg="#0F0021",bold,bg="#3B8EEA"

# ==========================================
# STATUS BAR
# ==========================================

set-option -g status-style 
    fg="#EF889C",bg="#0F0021"

set-option -g status-justify centre

# Inactive windows
set-window-option -g window-status-style 
    fg="#EF889C",bg="#25203D"

# Active window
set-window-option -g window-status-current-style 
    fg="#0F0021",bold,bg="#3B8EEA"

# Last active window
set-window-option -g window-status-last-style 
    fg="#3B8EEA",bold,bg="#25203D"

# Window separator
set-window-option -g window-status-separator " | "

# ==========================================
# STATUS BAR - LEFT SIDE
# ==========================================

set-option -g status-left-length 50

set-option -g status-left 
    "#[fg=#3B8EEA,bold] S: #S #[fg=#EF889C]│ #[fg=#F28B9E]W: #I-#W #[fg=#EF889C]│ P: #P "

# ==========================================
# STATUS BAR - RIGHT SIDE
# ==========================================

set-option -g status-right-length 50

set-option -g status-right 
    "#[fg=#EF889C] uptime: #(uptime | cut -f 4-5 -d' ' | cut -f 1 -d',') "

