# Set the default terminal mode to 256color mode
set -g default-terminal "screen-256color"

# Jellyfish colour palette
# Background: #0F0021  -> colour 234
# Foreground: #EF889C  -> colour 211
# Blue:       #3B8EEA  -> colour 69
# Highlight:  #F28B9E  -> colour 211
# Selection:  #25203D  -> colour 236

# Pane dividers
set-window-option -g pane-border-style fg=colour236,bg=colour234
set-window-option -g pane-active-border-style fg=colour69,bg=colour234

# Dim inactive panes
set-window-option -g window-style fg=colour211,bg=colour234
set-window-option -g window-active-style fg=colour211,bg=colour236

# Command / Message line
set-window-option -g message-style fg=colour234,bold,bg=colour69

# Status Bar
set-option -g status-style fg=colour211,bg=colour234
set-option -g status-justify centre

# Inactive windows
set-window-option -g window-status-style fg=colour211,bg=colour236

# Active window
set-window-option -g window-status-current-style fg=colour234,bold,bg=colour69

# Last window
set-window-option -g window-status-last-style fg=colour69,bold,bg=colour236

set-window-option -g window-status-separator " | "

# Left Side
set-option -g status-left-length 50
set-option -g status-left "#[fg=colour69,bold] S: #S #[fg=colour211]│ #[fg=colour69]W: #I-#W #[fg=colour211]│ #[fg=colour211]P: #P "

# Right Side
set-option -g status-right-length 50
set-option -g status-right "#[fg=colour211] uptime: #(uptime | cut -f 4-5 -d' ' | cut -f 1 -d',') "

# Enable Activity Alerts
set-option -g status-interval 60
set-window-option -g monitor-activity on

# Activity highlight
set-window-option -g window-status-activity-style fg=colour69,bg=colour236,bold

# Login shell
set-option -g default-command bash
